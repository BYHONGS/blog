<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{{ site_name }} 的个人博客:技术笔记与生活随笔{% endblock %}">
  <link rel="canonical" href="{% block canonical %}{{ request.base_url }}{% endblock %}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pygments-light.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pygments-dark.css') }}">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <nav class="container nav">
      <a class="brand" href="{{ url_for('main.index') }}">{{ site_name }}</a>
      <div class="nav-links">
        <a href="{{ url_for('main.index') }}">首页</a>
        <a href="{{ url_for('main.sites') }}">Sites</a>
        <a href="{{ url_for('main.about') }}">关于</a>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换深色模式">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <main class="container">{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <div class="container">© {{ current_year }} {{ site_name }} · 本站已运行 {{ uptime_days }} 天</div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
