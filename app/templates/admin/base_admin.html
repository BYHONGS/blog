<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}后台 - {{ site_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <nav class="container nav">
      <a class="brand" href="{{ url_for('admin.dashboard') }}">{{ site_name }} 后台</a>
      <div class="nav-links">
        <a href="{{ url_for('admin.post_new') }}">写文章</a>
        <a href="{{ url_for('admin.change_password') }}">改密码</a>
        <a href="{{ url_for('main.index') }}">查看站点</a>
        <a href="{{ url_for('admin.logout') }}">退出</a>
      </div>
    </nav>
  </header>

  <main class="container admin">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
      <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
